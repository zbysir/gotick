<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gotick</title>
<style>
  :root {
    --ground: #f7f7f7;
    --surface: #ffffff;
    --surface-2: #eeeeee;
    --ink: #131313;
    --muted: #5c5c5c;
    --faint: #828282;
    --line: #e0e0e0;
    --line-strong: #c0c0c0;
    --accent: #07743d;
    --warn: #855800;
    --crit: #a32118;
    --crit-soft: #fbe7e4;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #070707; --surface: #0d0d0d; --surface-2: #161616;
      --ink: #ededed; --muted: #a6a6a6; --faint: #737373;
      --line: #1f1f1f; --line-strong: #303030;
      --accent: #3ef08a;
      --warn: #f5b73d;
      --crit: #ff6f66; --crit-soft: #2c1614;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }

  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 26px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  .brand {
    font-family: var(--mono); font-size: 19px; font-weight: 600;
    letter-spacing: -.03em; color: var(--accent); text-decoration: none;
  }
  .tagline { color: var(--faint); font-size: 12.5px; }
  header .spacer { flex: 1; }
  .refresh { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  select, button, input {
    font-family: var(--sans); font-size: 13px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: 3px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, select:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .panel {
    border: 1px solid var(--line); border-radius: 3px;
    background: var(--surface); overflow: hidden; margin-bottom: 18px;
  }
  .panel-head {
    padding: 11px 16px; border-bottom: 1px solid var(--line);
    background: var(--surface-2); font-family: var(--mono);
    font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .scroller { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--faint);
    font-weight: 500; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--surface-2); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: var(--mono); font-size: 12.5px; }

  .pill {
    display: inline-block; font-family: var(--mono); font-size: 10.5px;
    letter-spacing: .07em; text-transform: uppercase; padding: 1px 6px;
    border-radius: 2px; white-space: nowrap; font-weight: 500;
    background: transparent;
    border: 1px solid currentColor;
    border-color: color-mix(in oklab, currentColor 40%, transparent);
  }
  /* 标签一律描边不填色。原来每种状态都铺一层浅底，而列表里绝大多数行是
     done，于是满屏都是填色的绿块。描边式只在需要注意的状态上才有颜色。
     border-color 用 color-mix 压到四成；不支持的浏览器落回上一行的 currentColor。 */
  .pill.done { color: var(--muted); }
  .pill.running { color: var(--accent); }   /* 绿＝活着，只给正在跑的 */
  .pill.failed, .pill.fail { color: var(--crit); }
  .pill.aborted, .pill.abort { color: var(--crit); }
  .pill.retry { color: var(--warn); }
  .pill.sleep { color: var(--muted); }
  .pill.wait_signal { color: var(--accent); }
  .pill.unknown, .pill.expired { color: var(--faint); }

  .err {
    color: var(--crit); font-family: var(--mono); font-size: 12px;
    display: block; margin-top: 4px; word-break: break-word;
  }
  .empty { padding: 40px 16px; text-align: center; color: var(--faint); }
  .kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 6px 18px; padding: 14px 16px; }
  .kv dt { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
  .kv dd { margin: 0; word-break: break-word; }
  .kv dd.mono { font-size: 12.5px; }

  .back { color: var(--accent); text-decoration: none; font-size: 13px; }
  .back:hover { text-decoration: underline; }
  h2 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }

  /* 时长条默认中性：每行一条绿杠也是「绿油油」的一部分，
     而“跑了多久”本身不是需要注意的信号，出问题才上色。 */
  .bar { height: 4px; background: var(--line-strong); border-radius: 2px; min-width: 2px; }
  .bar.fail { background: var(--crit); }
  .bar.retry { background: var(--warn); }
  .bartrack { background: var(--surface-2); border-radius: 2px; min-width: 60px; }

  .banner {
    border: 1px solid var(--crit); background: var(--crit-soft); color: var(--crit);
    border-radius: 3px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px;
  }

  .lang { font-size: 12px; margin-right: 14px; }
  .lang a { color: var(--faint); text-decoration: none; padding: 0 4px; }
  .lang a.on { color: var(--accent); }
  .lang .sep { color: var(--line-strong); }

  /* ---- 当前活动 ---- */
  .activity {
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    background: var(--surface); border-radius: 3px;
    padding: 16px 20px; margin-bottom: 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .activity.idle { border-left-color: var(--line-strong); }
  /* 失败/中止不能和「已完成」一个样：这条横幅是「现在怎么样」的总结。 */
  .activity.bad { border-left-color: var(--crit); }
  .activity-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .activity-state {
    font-size: 15px; font-weight: 650; letter-spacing: -.005em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .activity-task { font-family: var(--mono); font-size: 13px; color: var(--muted); }
  .activity-time {
    font-family: var(--mono); font-size: 13px; color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .activity-note { font-size: 12.5px; color: var(--faint); }

  /* 活着的状态给一个呼吸点，静态截图里也看得出「它还在动」 */
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); flex: none;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .dot.warn { background: var(--warn); }
  .dot.still { background: var(--line-strong); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: .35; transform: scale(.78); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
  }

  /* 倒计时进度条 */
  .prog {
    height: 6px; background: var(--surface-2);
    border-radius: 3px; overflow: hidden;
  }
  .prog > i {
    display: block; height: 100%; background: var(--accent);
    border-radius: 3px; transition: width 1s linear;
  }
  .prog.warn > i { background: var(--warn); }
  @media (prefers-reduced-motion: reduce) {
    .prog > i { transition: none; }
  }

  td .prog { margin-top: 5px; }
  .countdown { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="#/">gotick</a>
    <span class="tagline">workflow inspector</span>
    <span class="spacer"></span>
    <span class="lang" id="lang"></span>
    <span class="refresh" id="refresh"></span>
  </header>
  <div id="app"><div class="empty" id="boot"></div></div>
</div>

<script>
"use strict";

// ---------- 多语言 ----------
//
// 没有引入任何框架：这个界面本来就是模板字符串拼出来的，多语言需要的
// 只是一个字典加一个 t()。为了它把 React/Preact 和一条 npm 构建链塞进
// 一个纯 Go 仓库，会把「内嵌界面零依赖」这个卖点直接折掉。
const MESSAGES = {
  zh: {
    loading: "加载中…", back: "← 返回列表", readFail: "读取失败：",
    secAgo: "{n} 秒前", minAgo: "{n} 分钟前", hourAgo: "{n} 小时前", dayAgo: "{n} 天前",
    soon: "即将继续",
    allFlows: "全部 flow", allStatus: "全部状态", reload: "刷新",
    runs: "运行实例", runsCount: "{n} / {total} 条",
    thStatus: "状态", thFlow: "Flow", thCallId: "Call ID", thStarted: "开始",
    thDuration: "耗时", thRuns: "跑了几遍", thFailedAt: "失败于", thRetry: "重试",
    listEmpty: "还没有运行记录。触发一个 flow 之后回来看看。",
    actRunning: "执行中", actRunningNote: "任务正在某个节点上运行，心跳还在续期",
    actSleeping: "睡眠中", actSleepingNote: "到点后会被自动唤醒；等待期间不占用任何进程，重启也不受影响",
    actRetrying: "等待重试", actRetryingNote: "上一次执行失败了，退避结束后会再试一次",
    actScheduling: "调度中", actSchedulingNote: "正处在两步之间，马上会被某个 worker 接走",
    actAwaiting: "等信号",
    actAwaitingNote: "停在这里等一个外部信号（支付回调、人工审批之类）。等待期间不占用任何进程，重启也不受影响。",
    actAwaitingForeverNote: "没有设超时，所以它会一直等——除非有人发来这个信号，或者取消这次调用。",
    actGiveUpIn: "超时还有 ",
    actDone: "已完成", actFailed: "已失败", actAborted: "已终止",
    actLeft: "还有 ", actRan: "已运行 ",
    kindDone: "任务完成", kindSleep: "进入睡眠", kindSleepRearm: "重新计时",
    kindRetry: "安排重试", kindWait: "等待下一步", kindFail: "任务失败",
    kindAbort: "流程终止", kindFinish: "流程跑完", kindWaitSignal: "停下等信号",
    execLog: "执行记录", laps: "{n} 遍", lapsMore: "（另有 {n} 遍未记录完）",
    legacyRun: "这次调用是在执行记录上线之前跑的。",
    thTime: "时刻", thWhat: "这一遍做了什么", thGap: "距上一遍", earlyWake: "早醒",
    noteRearm: "有 {n} 遍是被提前唤醒后又重新计时的——这一遍什么都没推进，而且重新入队本身要花掉一次队列调度的时间。",
    noteGap: "第 {i} 遍跑完之后本该立刻继续，实际隔了 {gap}——这段时间花在了消息队列的调度上。",
    overview: "概览", dStarted: "开始", dEnded: "结束", dDuration: "耗时",
    dExecCount: "执行次数", dFailedAt: "失败于", dError: "错误",
    tasks: "任务", tasksCount: "{n} 个", tasksEmpty: "这次调用还没有任何任务状态。",
    cached: "缓存结果",
    stopped: "已结束，停止自动刷新", syncEvery: "每 {n} 秒同步一次",
  },
  en: {
    loading: "Loading…", back: "← Back to list", readFail: "Failed to load: ",
    secAgo: "{n}s ago", minAgo: "{n}m ago", hourAgo: "{n}h ago", dayAgo: "{n}d ago",
    soon: "resuming",
    allFlows: "All flows", allStatus: "All statuses", reload: "Reload",
    runs: "Runs", runsCount: "{n} / {total}",
    thStatus: "Status", thFlow: "Flow", thCallId: "Call ID", thStarted: "Started",
    thDuration: "Duration", thRuns: "Runs", thFailedAt: "Failed at", thRetry: "Retries",
    listEmpty: "No runs yet. Trigger a flow and come back.",
    actRunning: "Running", actRunningNote: "A task is executing on some node; its heartbeat is still being renewed",
    actSleeping: "Sleeping", actSleepingNote: "It wakes automatically when due. While waiting it holds no process, and a restart doesn't affect it",
    actRetrying: "Retry pending", actRetryingNote: "The last attempt failed; it will try again once the backoff ends",
    actScheduling: "Scheduling", actSchedulingNote: "Between two steps — a worker will pick it up shortly",
    actAwaiting: "Awaiting signal",
    actAwaitingNote: "Parked here waiting on an outside event — a payment callback, a human approval. It holds no process while waiting, and a restart doesn't affect it.",
    actAwaitingForeverNote: "No timeout was set, so it waits indefinitely — until someone sends this signal, or the call is canceled.",
    actGiveUpIn: "gives up in ",
    actDone: "Done", actFailed: "Failed", actAborted: "Aborted",
    actLeft: "wakes in ", actRan: "running for ",
    kindDone: "task finished", kindSleep: "went to sleep", kindSleepRearm: "re-armed timer",
    kindRetry: "retry scheduled", kindWait: "waiting for next step", kindFail: "task failed",
    kindAbort: "flow aborted", kindFinish: "flow completed", kindWaitSignal: "parked to await a signal",
    execLog: "Execution log", laps: "{n} runs", lapsMore: " ({n} more not fully recorded)",
    legacyRun: "This call ran before the execution log existed.",
    thTime: "Time", thWhat: "What this run did", thGap: "Since previous", earlyWake: "early",
    noteRearm: "{n} runs were woken early and re-armed — those runs advanced nothing, and re-queueing itself costs one scheduling round.",
    noteGap: "Run {i} should have continued immediately after finishing, but {gap} passed — that time went into queue scheduling.",
    overview: "Overview", dStarted: "Started", dEnded: "Ended", dDuration: "Duration",
    dExecCount: "Times executed", dFailedAt: "Failed at", dError: "Error",
    tasks: "Tasks", tasksCount: "{n}", tasksEmpty: "No task state recorded for this call yet.",
    cached: "Cached results",
    stopped: "Finished — auto-refresh stopped", syncEvery: "syncing every {n}s",
  },
};

const LANG_KEY = "gotick.lang";
// 默认英文：这是个开源项目的运维界面，读者不一定是中文使用者。
// 不跟随 navigator.language——同一个人在不同机器上看到不同语言更让人困惑。
let LANG = localStorage.getItem(LANG_KEY) || "en";
if (!MESSAGES[LANG]) LANG = "en";

function t(key, vars) {
  let str = (MESSAGES[LANG] && MESSAGES[LANG][key]) ?? MESSAGES.zh[key] ?? key;
  if (vars) for (const k in vars) str = str.split("{" + k + "}").join(vars[k]);
  return str;
}

function setLang(l) {
  if (!MESSAGES[l] || l === LANG) return;
  LANG = l;
  localStorage.setItem(LANG_KEY, l);
  document.documentElement.lang = l === "zh" ? "zh" : "en";
  renderLangSwitch();
  route();
}

function renderLangSwitch() {
  const el = document.getElementById("lang");
  if (!el) return;
  el.innerHTML = ["zh", "en"].map(l =>
    `<a href="#" data-lang="${l}" class="${l === LANG ? "on" : ""}">${l === "zh" ? "中文" : "EN"}</a>`
  ).join('<span class="sep">/</span>');
}

document.addEventListener("click", e => {
  const a = e.target.closest("#lang a[data-lang]");
  if (!a) return;
  e.preventDefault();
  setLang(a.dataset.lang);
});

// 页面可能被挂在任意前缀下（/_gotick/ 之类），所以所有请求都相对当前目录。
const BASE = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const app = document.getElementById("app");
const refreshEl = document.getElementById("refresh");

let timer = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

async function api(path) {
  const res = await fetch(BASE + path, { headers: { "Accept": "application/json" } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || ("HTTP " + res.status));
  return body;
}

function fmtTime(iso) {
  if (!iso || iso.startsWith("0001-")) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ` +
         `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function ago(iso) {
  if (!iso || iso.startsWith("0001-")) return "—";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (isNaN(diff)) return "—";
  if (diff < 60) return t("secAgo", {n: Math.max(0, Math.round(diff))});
  if (diff < 3600) return t("minAgo", {n: Math.round(diff / 60)});
  if (diff < 86400) return t("hourAgo", {n: Math.round(diff / 3600)});
  return t("dayAgo", {n: Math.round(diff / 86400)});
}

function pill(status) {
  return `<span class="pill ${esc(status || "unknown")}">${esc(status || "unknown")}</span>`;
}

function isZeroTime(iso) {
  return !iso || iso.startsWith("0001-");
}

// humanDuration 把毫秒渲染成人读的时长。秒级以下不显示，避免读数一直在抖。
function humanDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), rs = s % 60;
  if (m < 60) return rs ? `${m}m${rs}s` : `${m}m`;
  const h = Math.floor(m / 60), rm = m % 60;
  if (h < 24) return rm ? `${h}h${rm}m` : `${h}h`;
  const d = Math.floor(h / 24);
  return `${d}d${h % 24}h`;
}

// tickDynamic 每秒刷新一次页面上跟时间有关的部分。
//
// 这一步不发请求：轮询是 3 秒一次，光靠它倒计时会一跳三秒，
// 看起来像卡住了而不是在走。本地走时让「还在动」这件事一眼可见。
function tickDynamic() {
  const now = Date.now();

  document.querySelectorAll("[data-countdown]").forEach(el => {
    const left = Date.parse(el.dataset.countdown) - now;
    el.textContent = left > 0 ? humanDuration(left) : t("soon");
  });

  document.querySelectorAll("[data-elapsed]").forEach(el => {
    el.textContent = humanDuration(now - Date.parse(el.dataset.elapsed));
  });

  document.querySelectorAll("[data-from]").forEach(el => {
    const from = Date.parse(el.dataset.from), to = Date.parse(el.dataset.to);
    const pct = to > from ? Math.min(100, Math.max(0, ((now - from) / (to - from)) * 100)) : 100;
    el.style.width = pct.toFixed(2) + "%";
  });
}

setInterval(tickDynamic, 1000);

// countdownTo 渲染一个会自己走的倒计时；起止时间都有就顺带给一条进度条。
function countdownTo(until, since, warn) {
  if (isZeroTime(until)) return "—";

  let html = `<span class="countdown" data-countdown="${esc(until)}">…</span>`;
  if (!isZeroTime(since)) {
    html += `<div class="prog${warn ? " warn" : ""}">` +
            `<i data-from="${esc(since)}" data-to="${esc(until)}"></i></div>`;
  }
  return html;
}

function banner(msg) {
  return `<div class="banner">${esc(msg)}</div>`;
}

function setRefresh(text) { refreshEl.textContent = text; }

// ---------- 列表页 ----------

async function renderList() {
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  const flow = params.get("flow") || "";
  const status = params.get("status") || "";

  let flows = { flows: [], total_runs: 0 };
  let data = { runs: [], total: 0 };
  try {
    [flows, data] = await Promise.all([
      api("api/flows"),
      api("api/runs?" + new URLSearchParams({ flow, status, limit: "100" })),
    ]);
  } catch (e) {
    app.innerHTML = banner(t("readFail") + e.message);
    return;
  }

  const options = [`<option value="">${t("allFlows")}</option>`].concat(
    (flows.flows || []).map(f =>
      `<option value="${esc(f.id)}" ${f.id === flow ? "selected" : ""}>${esc(f.id)} (${f.runs})</option>`)
  ).join("");

  const statuses = ["", "running", "done", "failed", "aborted"];
  const statusOptions = statuses.map(s =>
    `<option value="${s}" ${s === status ? "selected" : ""}>${s === "" ? t("allStatus") : s}</option>`
  ).join("");

  const rows = (data.runs || []).map(r => `
    <tr class="clickable" data-call="${esc(r.call_id)}">
      <td>${pill(r.status)}</td>
      <td class="mono">${esc(r.flow_id || "—")}</td>
      <td class="mono">${esc(r.call_id.slice(0, 12))}</td>
      <td class="num" title="${esc(fmtTime(r.started_at))}">${esc(ago(r.started_at))}</td>
      <td class="num">${esc(r.duration_text)}</td>
      <td class="num">${r.replays}</td>
      <td>
        ${r.failed_task ? `<span class="mono">${esc(r.failed_task)}</span>` : "—"}
        ${r.error ? `<span class="err">${esc(r.error)}</span>` : ""}
      </td>
    </tr>`).join("");

  app.innerHTML = `
    <div class="toolbar">
      <select id="flowFilter">${options}</select>
      <select id="statusFilter">${statusOptions}</select>
      <button id="reload">${t("reload")}</button>
    </div>
    <div class="panel">
      <div class="panel-head">
        <span>${t("runs")}</span>
        <span>${t("runsCount", {n: data.runs.length, total: data.total})}</span>
      </div>
      <div class="scroller">
        ${rows ? `<table>
          <thead><tr>
            <th>${t("thStatus")}</th><th>${t("thFlow")}</th><th>${t("thCallId")}</th>
            <th>${t("thStarted")}</th><th>${t("thDuration")}</th><th>${t("thRuns")}</th><th>${t("thFailedAt")}</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty">${t("listEmpty")}</div>`}
      </div>
    </div>`;

  document.getElementById("flowFilter").onchange = e => {
    location.hash = "#/?" + new URLSearchParams({ flow: e.target.value, status });
  };
  document.getElementById("statusFilter").onchange = e => {
    location.hash = "#/?" + new URLSearchParams({ flow, status: e.target.value });
  };
  document.getElementById("reload").onclick = () => route();
  app.querySelectorAll("tr.clickable").forEach(tr => {
    tr.onclick = () => { location.hash = "#/run/" + tr.dataset.call; };
  });

  // 有实例还在跑就自动刷新，跑完了就停下来，别无谓地打 Redis。
  const anyRunning = (data.runs || []).some(r => r.running);
  scheduleRefresh(anyRunning);
}

// ---------- 详情页 ----------

// activityBanner 回答「此刻在干什么」。
//
// 一张任务表回答不了这个问题：一个正在睡的流程，表里只是某一行写着 sleep
// 加一个时间戳，得自己拿当前时间去减才知道还要等多久。
const ACTIVITY = {
  running:    { key: "actRunning",    dot: "",      note: "actRunningNote" },
  sleeping:   { key: "actSleeping",   dot: "",      note: "actSleepingNote" },
  retrying:   { key: "actRetrying",   dot: "warn",  note: "actRetryingNote" },
  scheduling: { key: "actScheduling", dot: "",      note: "actSchedulingNote" },
  awaiting_signal: {
    key: "actAwaiting",
    dot: "",
    note: "actAwaitingNote",
    // 无限等时换一句话：说「马上」「还剩」都是假的
    foreverNote: "actAwaitingForeverNote",
  },
  done:       { key: "actDone",       dot: "still" },
  failed:     { key: "actFailed",     dot: "still" },
  aborted:    { key: "actAborted",    dot: "still" },
};

function activityBanner(a) {
  if (!a || !a.state) return "";

  const m = ACTIVITY[a.state] || { dot: "still" };
  const label = m.key ? t(m.key) : a.state;
  let noteKey = m.note;
  if (a.state === "awaiting_signal" && isZeroTime(a.until) && m.foreverNote) {
    noteKey = m.foreverNote;
  }
  const note = noteKey ? t(noteKey) : "";
  const idle = ["done", "failed", "aborted"].includes(a.state);
  const bad = ["failed", "aborted"].includes(a.state);

  let timing = "";
  let progress = "";

  if (a.state === "awaiting_signal") {
    // 有 until = 设了超时，倒计时到的是「放弃等待」的时刻，措辞要和睡眠区分开
    if (!isZeroTime(a.until)) {
      timing = `<span class="activity-time">${t("actGiveUpIn")}` +
               `<span class="countdown" data-countdown="${esc(a.until)}">…</span></span>`;
      if (!isZeroTime(a.since)) {
        progress = `<div class="prog"><i data-from="${esc(a.since)}" data-to="${esc(a.until)}"></i></div>`;
      }
    } else if (!isZeroTime(a.since)) {
      // 无限等：只报「已经等了多久」，不编一个不存在的倒计时
      timing = `<span class="activity-time">${t("actRan")}` +
               `<span class="countdown" data-elapsed="${esc(a.since)}">…</span></span>`;
    }
  } else if ((a.state === "sleeping" || a.state === "retrying") && !isZeroTime(a.until)) {
    timing = `<span class="activity-time">${t("actLeft")}` +
             `<span class="countdown" data-countdown="${esc(a.until)}">…</span></span>`;
    if (!isZeroTime(a.since)) {
      progress = `<div class="prog${a.state === "retrying" ? " warn" : ""}">` +
                 `<i data-from="${esc(a.since)}" data-to="${esc(a.until)}"></i></div>`;
    }
  } else if (a.state === "running" && !isZeroTime(a.since)) {
    timing = `<span class="activity-time">${t("actRan")}` +
             `<span class="countdown" data-elapsed="${esc(a.since)}">…</span></span>`;
  }

  return `
    <div class="activity${idle ? " idle" : ""}${bad ? " bad" : ""}">
      <div class="activity-head">
        <span class="activity-state"><i class="dot ${m.dot}"></i>${esc(label)}</span>
        ${a.task ? `<span class="activity-task">${esc(a.task)}</span>` : ""}
        ${timing}
      </div>
      ${progress}
      ${note ? `<div class="activity-note">${esc(note)}</div>` : ""}
    </div>`;
}

// replayPanel 把函数每一遍的执行画出来。
//
// 光有一个「跑了 5 遍」的数字看不出问题：一遍本该立刻继续、却等了 5 秒
// 才被调度的执行，在计数里和正常的长得一模一样，证据全在间隔里。
const REPLAY_KIND = {
  done:        "kindDone",
  sleep:       "kindSleep",
  sleep_rearm: "kindSleepRearm",
  retry:       "kindRetry",
  wait:        "kindWait",
  fail:        "kindFail",
  abort:       "kindAbort",
  finish:      "kindFinish",
  wait_signal: "kindWaitSignal",
};

// GAP_WARN 超过这个间隔才值得看一眼。
const GAP_WARN = 2000;

// CONTINUES_IMMEDIATELY 是那些「做完就该立刻继续」的结束方式。
//
// 只有它们后面的间隔才说明问题：sleep 和 retry 后面本来就该有间隔，
// 那是用户自己要求的等待。分不清这两者的告警会一直误报，
// 而一个总在误报的告警等于没有告警。
const CONTINUES_IMMEDIATELY = { done: true, sleep_rearm: true };

function replayPanel(run) {
  const marks = run.marks || [];
  if (!marks.length) {
    return `<div class="panel">
      <div class="panel-head"><span>${t("execLog")}</span><span>${t("laps", {n: run.replays || 0})}</span></div>
      <div class="empty">${t("legacyRun")}</div>
    </div>`;
  }

  const rows = marks.map((m, i) => {
    const at = Date.parse(m.at);
    const gap = i === 0 ? 0 : at - Date.parse(marks[i - 1].at);
    const slow = i > 0 && gap >= GAP_WARN && CONTINUES_IMMEDIATELY[marks[i - 1].kind];
    const odd = m.kind === "sleep_rearm";

    return `<tr>
      <td class="num">#${i + 1}</td>
      <td class="num">${esc(fmtTime(m.at).slice(11))}<span style="opacity:.5">${esc(fracSeconds(m.at))}</span></td>
      <td>${esc(REPLAY_KIND[m.kind] ? t(REPLAY_KIND[m.kind]) : (m.kind || "—"))}${odd ? ` <span class="pill retry">${t("earlyWake")}</span>` : ""}</td>
      <td class="mono">${esc(m.task || "—")}</td>
      <td class="num" ${slow ? 'style="color:var(--warn)"' : ""}>${i === 0 ? "—" : "+" + humanGap(gap)}</td>
    </tr>`;
  }).join("");

  // 只有明显异常才提示，不然每次都挂一条横幅反而没人看
  const worst = marks.reduce((acc, m, i) => {
    if (i === 0 || !CONTINUES_IMMEDIATELY[marks[i - 1].kind]) return acc;
    const gap = Date.parse(m.at) - Date.parse(marks[i - 1].at);
    return gap > acc.gap ? { gap, i } : acc;
  }, { gap: 0, i: 0 });

  const rearms = marks.filter(m => m.kind === "sleep_rearm").length;
  let note = "";
  if (rearms > 0) {
    note = `<div class="activity-note" style="padding:10px 16px;border-top:1px solid var(--line)">` +
      `${t("noteRearm", {n: rearms})}</div>`;
  } else if (worst.gap >= GAP_WARN) {
    note = `<div class="activity-note" style="padding:10px 16px;border-top:1px solid var(--line)">` +
      `${t("noteGap", {i: worst.i, gap: humanGap(worst.gap)})}</div>`;
  }

  return `<div class="panel">
    <div class="panel-head">
      <span>${t("execLog")}</span>
      <span>${t("laps", {n: marks.length})}${run.replays > marks.length ? t("lapsMore", {n: run.replays - marks.length}) : ""}</span>
    </div>
    <div class="scroller">
      <table>
        <thead><tr><th>#</th><th>${t("thTime")}</th><th>${t("thWhat")}</th><th>Task</th><th>${t("thGap")}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    ${note}
  </div>`;
}

function fracSeconds(iso) {
  const m = /\.(\d{1,3})/.exec(iso || "");
  return m ? "." + m[1].padEnd(3, "0") : "";
}

function humanGap(ms) {
  if (ms < 1000) return Math.round(ms) + "ms";
  return (ms / 1000).toFixed(1) + "s";
}

async function renderDetail(callId) {
  let d;
  try {
    d = await api("api/runs/" + encodeURIComponent(callId));
  } catch (e) {
    app.innerHTML = `<a class="back" href="#/">${t("back")}</a>` + banner(t("readFail") + e.message);
    setRefresh("");
    return;
  }

  const run = d.run || {};
  const tasks = d.tasks || [];
  const meta = d.metadata || { user: {}, cached: {} };

  const maxMs = Math.max(1, ...tasks.map(t => t.duration_ms || 0));
  const taskRows = tasks.map(t => {
    const cls = t.status === "fail" ? "fail" : (t.status === "retry" ? "retry" : "");

    // 时间那一列要按状态给不同的东西：还没结束的任务给会走的读数，
    // 已经结束的给固定耗时。
    let timing;
    if ((t.status === "sleep" || t.status === "retry") && !isZeroTime(t.run_at)) {
      timing = countdownTo(t.run_at, t.started_at, t.status === "retry");
    } else if (t.status === "running" && !isZeroTime(t.started_at)) {
      timing = `<span class="countdown" data-elapsed="${esc(t.started_at)}">…</span>`;
    } else {
      timing = esc(t.duration_text);
    }

    const width = Math.round(((t.duration_ms || 0) / maxMs) * 100);
    const bar = (t.duration_ms || 0) > 0
      ? `<div class="bartrack"><div class="bar ${cls}" style="width:${width}%"></div></div>`
      : "";

    return `
      <tr>
        <td class="mono">${esc(t.key)}</td>
        <td>${pill(t.status)}</td>
        <td class="num">${t.retry_count || 0}</td>
        <td class="num" title="${esc(fmtTime(t.started_at))}">${esc(isZeroTime(t.started_at) ? "—" : fmtTime(t.started_at).slice(11))}</td>
        <td class="num" style="min-width:96px">${timing}</td>
        <td style="min-width:120px">${bar}</td>
        <td>${(t.errs || []).map(e => `<span class="err">${esc(e)}</span>`).join("") || "—"}</td>
      </tr>`;
  }).join("");

  const kvRows = obj => Object.keys(obj).sort().map(k =>
    `<dt>${esc(k)}</dt><dd class="mono">${esc(obj[k])}</dd>`).join("");

  app.innerHTML = `
    <a class="back" href="#/">${t("back")}</a>
    <h2 style="margin-top:14px">${esc(run.flow_id || "unknown flow")}</h2>
    <div class="sub mono">${esc(callId)}</div>

    ${activityBanner(d.activity)}

    <div class="panel">
      <div class="panel-head"><span>${t("overview")}</span><span>${esc(run.status || "unknown")}</span></div>
      <dl class="kv">
        <dt>${t("thStatus")}</dt><dd>${pill(run.status)}</dd>
        <dt>${t("dStarted")}</dt><dd class="mono">${esc(fmtTime(run.started_at))}</dd>
        <dt>${t("dEnded")}</dt><dd class="mono">${esc(fmtTime(run.ended_at))}</dd>
        <dt>${t("dDuration")}</dt><dd class="mono">${esc(run.duration_text || "—")}</dd>
        <dt>${t("dExecCount")}</dt><dd class="mono">${run.replays == null ? "—" : run.replays}</dd>
        ${run.failed_task ? `<dt>${t("dFailedAt")}</dt><dd class="mono">${esc(run.failed_task)}</dd>` : ""}
        ${run.error ? `<dt>${t("dError")}</dt><dd><span class="err">${esc(run.error)}</span></dd>` : ""}
      </dl>
    </div>

    ${replayPanel(run)}

    <div class="panel">
      <div class="panel-head"><span>${t("tasks")}</span><span>${t("tasksCount", {n: tasks.length})}</span></div>
      <div class="scroller">
        ${tasks.length ? `<table>
          <thead><tr>
            <th>Task</th><th>${t("thStatus")}</th><th>${t("thRetry")}</th><th>${t("dStarted")}</th><th>${t("dDuration")}</th><th></th><th>${t("dError")}</th>
          </tr></thead>
          <tbody>${taskRows}</tbody>
        </table>` : `<div class="empty">${t("tasksEmpty")}</div>`}
      </div>
    </div>

    ${Object.keys(meta.user || {}).length ? `<div class="panel">
      <div class="panel-head"><span>Metadata</span></div>
      <dl class="kv">${kvRows(meta.user)}</dl>
    </div>` : ""}

    ${Object.keys(meta.cached || {}).length ? `<div class="panel">
      <div class="panel-head"><span>${t("cached")}</span><span>Memo / Array / Async</span></div>
      <dl class="kv">${kvRows(meta.cached)}</dl>
    </div>` : ""}`;

  tickDynamic();

  // 睡得还久就没必要一直问后端——倒计时在本地自己走，看起来一样是活的。
  let poll = 3000;
  const a = d.activity;
  if (a && (a.state === "sleeping" || a.state === "awaiting_signal") && !isZeroTime(a.until)) {
    const left = Date.parse(a.until) - Date.now();
    if (left > 30000) poll = Math.min(15000, left - 2000);
  }

  scheduleRefresh(!!run.running, poll);
}

// ---------- 路由 ----------

function scheduleRefresh(active, delayMs) {
  if (timer) { clearTimeout(timer); timer = null; }
  if (!active) { setRefresh(t("stopped")); return; }
  const ms = delayMs || 3000;
  setRefresh(t("syncEvery", {n: Math.round(ms / 1000)}));
  timer = setTimeout(route, ms);
}

function route() {
  const hash = location.hash || "#/";
  const m = hash.match(/^#\/run\/([^?]+)/);
  if (m) renderDetail(decodeURIComponent(m[1]));
  else renderList();
}

document.documentElement.lang = LANG === "zh" ? "zh" : "en";
document.getElementById("boot").textContent = t("loading");
renderLangSwitch();

window.addEventListener("hashchange", route);
route();
</script>
</body>
